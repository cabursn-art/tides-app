<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slack Finder</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slack Finder">
<meta name="theme-color" content="#1a2847">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column phone app, sticky header with spot picker, two views swapped by hash. Single dark look by choice (matches the harbor app it extends). */
:root{
  --bg:#152038; --panel:#1a2847; --panel2:#22325a; --bar:#3f5080; --bar-today:#5a6b94;
  --fg:#f2f5fb; --fg2:#c9d2e3; --muted:#8e9bb8; --grid:#55627f; --line:#ffffff;
  --good:#5ad38a; --good-dim:#2f6b4a; --warn:#e9b949; --bad:#e36a6a; --none:#3a4866; --today:#ff6b5e;
  --font:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:0.5px solid var(--grid);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr button{background:none;border:0;color:var(--fg);font:inherit;font-size:16px;font-weight:600;padding:6px 8px;border-radius:8px;display:flex;align-items:center;gap:6px}
.hdr button:focus-visible,.tabs button:focus-visible,button:focus-visible{outline:2px solid var(--good);outline-offset:2px}
.hdr .ico{background:var(--panel2);width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:0}
main{padding-block:12px calc(76px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:0 6px 6px}
.daynav button{background:var(--panel2);border:0;color:var(--fg);font:inherit;font-size:18px;width:40px;height:36px;border-radius:8px}
.daynav .d{font-size:17px;font-weight:600;text-align:center}
.daynav .d small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.status{font-size:12px;color:var(--muted);min-height:16px;margin:2px 6px 8px;display:flex;flex-wrap:wrap;gap:4px 12px}
.status .err{color:var(--warn)}
#chart{display:block;width:100%;height:auto}
.moon{width:16px;height:16px;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:11px;color:var(--fg2);margin-top:8px}
.legend span{display:flex;align-items:center;gap:4px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block}
.sq{width:12px;height:8px;border-radius:4px;display:inline-block}
.cal{display:flex;flex-direction:column}
.cal .hd{display:flex;align-items:center;font-size:10px;color:var(--muted);padding:0 0 6px}
.cal .hd span{text-align:center}
.row{display:flex;align-items:center;height:42px;background:none;border:0;color:inherit;font:inherit;padding:0;width:100%;text-align:left;border-radius:6px}
.row:active{background:var(--panel2)}
.row .mid{flex:1;display:flex;align-items:center;min-width:0}
.row .bw{flex:1;display:flex;justify-content:center;min-width:0}
.row .lo,.row .hi{flex:none;font-size:12px;color:var(--fg2);width:44px;font-variant-numeric:tabular-nums}
.row .lo{text-align:right;padding-right:4px}.row .hi{text-align:left;padding-left:4px}
.row .bar{height:32px;min-width:112px;max-width:100%;box-sizing:border-box;border-radius:6px;background:var(--bar);border:0.5px solid var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:600;white-space:nowrap}
.row .bar.today{background:var(--bar-today);color:var(--today)}
.row .bar.go{background:var(--good-dim);border:1.5px solid var(--good)}
.row .bar .wd{font-size:11px;font-weight:400;color:var(--muted)}
.row .bar .wd.we{color:#ffd27a}
.pill{height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.g{background:var(--good);color:#0f2b1c}.pill.y{background:var(--warn);color:#3d2e00}.pill.r{background:var(--bad);color:#3a0c0c}.pill.n{background:var(--none);color:var(--muted);font-weight:400}
.pc{display:flex;justify-content:center;flex:none}
.sheet{position:fixed;inset:0;background:rgba(5,10,25,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--panel);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding-block:16px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:85vh;overflow-y:auto}
.sheet h2{font-size:16px;margin:0 0 10px;font-weight:600}
.spot{display:block;width:100%;background:var(--panel2);border:0;color:var(--fg);font:inherit;text-align:left;padding:12px 14px;border-radius:10px;margin-bottom:8px}
.spot.on{outline:2px solid var(--good)}
.spot small{display:block;color:var(--muted);font-size:12px}
.set{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;font-size:13px}
.set label{color:var(--fg2)}
.set input{width:84px;background:var(--panel2);border:0.5px solid var(--grid);color:var(--fg);font:inherit;font-family:var(--mono);padding:6px 8px;border-radius:6px;text-align:right}
.set h3{grid-column:1/-1;font-size:12px;color:var(--muted);margin:10px 0 0;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.btnrow{display:flex;gap:8px;margin-top:14px}
.btnrow button{flex:1;background:var(--panel2);border:0;color:var(--fg);font:inherit;font-weight:500;padding:10px;border-radius:8px}
.btnrow button.pri{background:var(--good);color:#0f2b1c}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;background:var(--panel);border-top:0.5px solid var(--grid);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.bnav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px}
.bnav button svg{width:24px;height:24px}
.bnav button[aria-selected="true"]{color:var(--good)}
.strips{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:0 6px}
.strips .cell{flex:none;display:flex;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.strips .lab{flex:none;position:sticky;left:0;background:var(--bg);font-size:10px;color:var(--muted);display:flex;align-items:center;padding-left:6px;z-index:1;box-sizing:border-box}
.strips .arrow{display:inline-block;font-size:11px;line-height:1}
.strips .spotname{position:sticky;left:0;display:inline-block;background:var(--bg);padding:4px 6px;color:var(--fg);font-size:13px;font-weight:600;z-index:2}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>
</head>
<body>

<div class="hdr">
  <button id="btnSpot" aria-label="Choose spot"><span id="spotName">Pillar Point Harbor</span><span style="color:var(--muted);font-weight:400">▾</span></button>
  <button id="btnSettings" class="ico" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>
<main>
  <div id="viewDay">
    <div class="daynav"><button id="prevDay" aria-label="Previous day">‹</button><div class="d" id="dayTitle">Loading…</div><button id="nextDay" aria-label="Next day">›</button></div>
    <div class="status" id="statusDay"></div>
    <svg id="chart" viewBox="0 0 380 585" role="img" aria-label="Tide, optimal conditions, wind and swell for the selected day"></svg>
  </div>
  <div id="viewCal" hidden>
    <div class="status" id="statusCal"></div>
    <div class="cal">
      <div class="hd"><span style="flex:1" id="calHint"></span><span style="width:64px">Swell<br>ft · sec</span><span style="width:44px">Wind<br>mph</span></div>
      <div id="calRows"></div>
    </div>
  </div>
  <div id="viewSpots" hidden>
    <div class="status" id="statusSpots"></div>
    <div id="strips" class="strips"></div>
  </div>
</main>
<nav class="bnav" aria-label="Sections">
  <button id="tabDay" data-v="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3-5 5-5 8 0s5 5 8 0"/><circle cx="12" cy="6" r="2.5"/></svg><span>Day</span></button>
  <button id="tabCal" data-v="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
  <button id="tabSpots" data-v="spots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h13"/><circle cx="19" cy="12" r="1.5"/><circle cx="20" cy="17" r="1.5"/></svg><span>Spots</span></button>
</nav>
<div id="sheet" class="sheet" hidden><div class="box" id="sheetBox"></div></div>

<script>
(function(){
'use strict';
// ---------- spots ----------
const SPOTS={
 pillar:{name:'Pillar Point Harbor',short:'Pillar Point',tide:'9414131',lat:37.495,lon:-122.49,cur:null,shadow:['NW','WNW','NNW'],open:['S','SSW','SW','SSE']},
 fortross:{name:'Fort Ross',short:'Fort Ross',tide:'9416024',lat:38.51,lon:-123.25,cur:null,shadow:[],open:['NW','WNW','W','SW']},
 gate:{name:'Golden Gate ship channel',short:'Golden Gate',tide:'9414290',lat:37.78,lon:-122.57,cur:'PCT0201',shadow:[],open:['W','WNW','NW','SW']},
 duxbury:{name:'Duxbury Reef',short:'Duxbury',tide:'9415020',lat:37.88,lon:-122.70,cur:null,shadow:[],open:['W','WNW','NW','SW']},
 monterey:{name:'Monterey',short:'Monterey',tide:'9413450',lat:36.62,lon:-121.92,cur:null,shadow:['NW','WNW','W'],open:['N','NNW']}
};
const DEFAULTS={fishStart:6,fishEnd:16,dayStart:6,dayEnd:18,curMax:0.7,swellMax:6,periodRatio:2,windGood:9,windMarg:17,lagH0:27.6,lagH1:13.7,lagL0:72.3,lagL1:8.5,lagL2:12.9,ktPerFt:0.27,openPenalty:1};
let S={...DEFAULTS};
const store={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const saved=store.get('sf.settings');if(saved)S={...DEFAULTS,...saved};
let spotKey=store.get('sf.spot')||'pillar';if(!SPOTS[spotKey])spotKey='pillar';
const TZ='America/Los_Angeles';const BUILD='2026-10-18.10';

// ---------- dates (all local to the Pacific coast) ----------
function todayStr(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function addDays(ds,n){const [y,m,d]=ds.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return t.toISOString().slice(0,10);}
function ymd(ds){return ds.replace(/-/g,'');}
function dow(ds){const [y,m,d]=ds.split('-').map(Number);return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(Date.UTC(y,m-1,d)).getUTCDay()];}
function longDate(ds){const [y,m,d]=ds.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));return new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(dt);}
function hoursFrom(dayStr,ts){ // ts "YYYY-MM-DD HH:MM" or "YYYY-MM-DDTHH:MM" local → hours relative to dayStr 00:00
  const d=ts.slice(0,10),hm=ts.slice(11,16);const [h,m]=hm.split(':').map(Number);
  const [y1,m1,d1]=dayStr.split('-').map(Number),[y2,m2,d2]=d.split('-').map(Number);
  const dd=(Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5;return dd*24+h+m/60;}
const fmt=h=>{h=((h%24)+24)%24;let hr=Math.floor(h),m=Math.round((h-hr)*60);if(m===60){hr++;m=0;}const ap=hr<12?'am':'pm';hr=hr%12||12;return hr+':'+String(m).padStart(2,'0')+ap;};
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
const compass=d=>['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(((d%360)+360)%360/22.5)%16];

// ---------- data ----------
const data={};// per spot: {tides:[{t,v,type}], cur:[...], om:{time[],sw[],per[],dir[],wind[],wdir[],gust[]}, fetched, errors[]}
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json();}
async function load(spot,force){
  const key='sf.data.'+spot;const now=Date.now();
  let d=data[spot]||store.get(key);
  if(d&&!force&&now-d.fetched<6*3600e3){data[spot]=d;return d;}
  const sp=SPOTS[spot];const t0=addDays(todayStr(),-3),t1=addDays(todayStr(),30);
  d={tides:null,cur:null,om:null,fetched:now,errors:[]};
  const jobs=[
    getJSON(`https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&station=${sp.tide}&begin_date=${ymd(t0)}&end_date=${ymd(t1)}&datum=MLLW&time_zone=lst_ldt&units=english&interval=hilo&format=json`)
      .then(j=>{if(!j.predictions)throw new Error(j.error?j.error.message:'no data');d.tides=j.predictions.map(p=>({t:p.t,v:+p.v,type:p.type}));})
      .catch(e=>d.errors.push('Tides (NOAA): '+e.message)),
    (async()=>{
      const [m,w]=await Promise.all([
        getJSON(`https://marine-api.open-meteo.com/v1/marine?latitude=${sp.lat}&longitude=${sp.lon}&hourly=swell_wave_height,swell_wave_period,swell_wave_direction,wave_height&length_unit=imperial&timezone=${encodeURIComponent(TZ)}&past_days=3&forecast_days=10`),
        getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${sp.lat}&longitude=${sp.lon}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=mph&timezone=${encodeURIComponent(TZ)}&past_days=3&forecast_days=10`)
      ]);
      d.om={time:m.hourly.time,sw:m.hourly.swell_wave_height,per:m.hourly.swell_wave_period,dir:m.hourly.swell_wave_direction,wave:m.hourly.wave_height,wind:w.hourly.wind_speed_10m,wdir:w.hourly.wind_direction_10m,gust:w.hourly.wind_gusts_10m};
    })().catch(e=>d.errors.push('Wind/swell (Open-Meteo): '+e.message))
  ];
  if(sp.cur)jobs.push(getJSON(`https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=currents_predictions&station=${sp.cur}&begin_date=${ymd(t0)}&end_date=${ymd(t1)}&time_zone=lst_ldt&units=english&interval=MAX_SLACK&format=json`)
      .then(j=>{const arr=j.current_predictions?j.current_predictions.cp:null;if(!arr)throw new Error(j.error?j.error.message:'no data');d.cur=arr.map(c=>({t:c.Time,type:c.Type,v:+c.Velocity_Major}));})
      .catch(e=>d.errors.push('Currents (NOAA): '+e.message)));
  await Promise.all(jobs);
  // keep the previous good copy for anything that failed
  const prev=data[spot]||store.get(key);
  if(prev){if(!d.tides&&prev.tides)d.tides=prev.tides;if(!d.om&&prev.om)d.om=prev.om;if(!d.cur&&prev.cur)d.cur=prev.cur;}
  data[spot]=d;if(d.tides)store.set(key,d);return d;
}

// ---------- models ----------
function tideModel(tides,dayStr){ // cosine between extrema; returns {tide(x), ext:[[h,v,'H'|'L']]}
  const ext=tides.map(p=>[hoursFrom(dayStr,p.t),p.v,p.type]).filter(e=>e[0]>-30&&e[0]<54);
  const tide=x=>{if(ext.length<2)return 0;let i=0;while(i<ext.length-2&&x>ext[i+1][0])i++;const [t1,h1]=ext[i],[t2,h2]=ext[i+1];return (h1+h2)/2+(h1-h2)/2*Math.cos(Math.PI*clamp((x-t1)/(t2-t1),0,1));};
  return {tide,ext};
}
function currentModel(ext,curRows,dayStr){ // returns {cur(x), slacks:[{t,turn,ty,h,src}]}
  let lobes=[],slacks=[];
  if(curRows&&curRows.length>3){ // real NOAA max/slack
    const rows=curRows.map(c=>({h:hoursFrom(dayStr,c.t),type:c.type,v:c.v})).filter(r=>r.h>-30&&r.h<54);
    let prevMax=null;
    for(const r of rows){if(r.type==='slack'){if(prevMax)lobes.push({a:r.h,peak:0,prev:prevMax});slacks.push({t:r.h,src:'noaa'});}else prevMax=r;}
    // lobe between consecutive slacks carries the max that falls between them
    const sl=rows.filter(r=>r.type==='slack');const mx=rows.filter(r=>r.type!=='slack');lobes=[];
    for(let i=0;i<sl.length-1;i++){const m=mx.find(q=>q.h>sl[i].h&&q.h<sl[i+1].h);lobes.push({a:sl[i].h,b:sl[i+1].h,peak:m?m.v:0});}
    for(const s of slacks){ // label each slack with the tide turn it follows
      let best=null,bl=99;for(const e of ext){const lag=s.t-e[0];if(lag>-1&&lag<4&&Math.abs(lag)<Math.abs(bl)){best=e;bl=lag;}}
      if(best){s.turn=best[0];s.ty=best[2];s.h=best[1];}
    }
  }else{ // fitted lag model (Point Lobos coefficients by default)
    for(let i=1;i<ext.length-1;i++){const [t,h,ty]=ext[i];const si=Math.abs(h-ext[i-1][1]),so=Math.abs(ext[i+1][1]-h);
      const lag=ty==='H'?S.lagH0+S.lagH1*si:S.lagL0+S.lagL1*si-S.lagL2*so;
      slacks.push({t:t+lag/60,turn:t,ty,h,src:'model',peak:(ty==='H'?-1:1)*S.ktPerFt*so});}
    for(let i=0;i<slacks.length-1;i++)lobes.push({a:slacks[i].t,b:slacks[i+1].t,peak:slacks[i].peak});
  }
  const cur=x=>{for(const l of lobes){if(x>=l.a&&x<=l.b)return l.peak*Math.sin(Math.PI*(x-l.a)/(l.b-l.a));}return 0;};
  return {cur,slacks,src:curRows&&curRows.length>3?'NOAA':'modeled'};
}
function omSeries(om,dayStr){ // hourly arrays → functions of hours from dayStr
  if(!om)return null;const idx=om.time.map(t=>hoursFrom(dayStr,t));
  const at=arr=>x=>{let i=0;while(i<idx.length-2&&x>idx[i+1])i++;if(x<idx[0]||x>idx[idx.length-1]+1)return null;const a=arr[i],b=arr[i+1];if(a==null||b==null)return a==null?b:a;const u=clamp((x-idx[i])/(idx[i+1]-idx[i]),0,1);return a+(b-a)*u;};
  const dirAt=arr=>x=>{let i=0;while(i<idx.length-2&&x>idx[i+1])i++;return arr[i];};
  return {sw:at(om.sw),per:at(om.per),wind:at(om.wind),gust:at(om.gust),dir:dirAt(om.dir),wdir:dirAt(om.wdir),has:x=>x>=idx[0]&&x<=idx[idx.length-1]};
}
const windLvl=w=>w==null?null:w<=S.windGood?0:w<=S.windMarg?1:2;
function swellLvl(h,p,dirDeg,spot){if(h==null||p==null)return null;let lvl=h>S.swellMax?2:(p>=S.periodRatio*h)?0:1;
  if(S.openPenalty&&dirDeg!=null&&lvl<2){const c=compass(dirDeg);const sp=SPOTS[spot];if(sp.open.includes(c)&&h>=3)lvl=Math.min(2,lvl+1);}return lvl;}

// ---------- drawing ----------
const COL=['#5ad38a','#e9b949','#e36a6a'];
function drawDay(spot,dayStr,d){
  const svg=document.getElementById('chart');const st=document.getElementById('statusDay');
  const x0=8;let XE=372;const X=h=>x0+(XE-x0)*h/24;let s='';
  const axisX=y=>{for(let h=2;h<24;h+=2){const lab=h===12?'noon':(h<12?h:h-12);s+=`<text x="${X(h)}" y="${y}" text-anchor="middle" font-size="10" fill="#8e9bb8">${lab}</text>`;}};
  const grid=(vals,f,Yf)=>{for(const v of vals){s+=`<line x1="${x0}" y1="${Yf(v)}" x2="${XE}" y2="${Yf(v)}" stroke="#55627f" stroke-width="0.6"/><text x="${x0+3}" y="${Yf(v)-3}" text-anchor="start" font-size="10" fill="#8e9bb8">${f(v)}</text>`;}};
  const title=(y,t)=>{s+=`<text x="${x0}" y="${y}" font-size="11" fill="#c9d2e3">${t}</text>`;};
  const bands=(Yf,e)=>{for(let i=0;i<3;i++)s+=`<rect x="${x0}" y="${Yf(e[i+1])}" width="${XE-x0}" height="${Yf(e[i])-Yf(e[i+1])}" fill="${COL[i]}" opacity="0.07"/>`;};
  const tiered=(fn,Yf,lvl,w,dash)=>{let segs=[],prev=null,seg=[];for(let x=0;x<=24.0001;x+=0.1){const v=fn(x);if(v==null){if(seg.length){segs.push({g:prev,pts:seg});seg=[];prev=null;}continue;}const g=lvl(x);if(prev!==null&&g!==prev){segs.push({g:prev,pts:seg});seg=[seg[seg.length-1]];}seg.push([x,v]);prev=g;}if(seg.length)segs.push({g:prev,pts:seg});
    for(const sg of segs){const dd=sg.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Yf(p[1]).toFixed(1)).join(' ');const c=sg.g===0?COL[0]:sg.g===1?COL[1]:sg.g===2?COL[2]:sg.g===-2?'#8e9bb8':'#ffffff';s+=`<path d="${dd}" fill="none" stroke="${c}" stroke-width="${w}"${dash?' stroke-dasharray="2,4"':''} stroke-linecap="round" stroke-linejoin="round"/>`;}return segs;};

  const tm=d.tides?tideModel(d.tides,dayStr):null;
  const lo=tm?Math.min(...tm.ext.filter(e=>e[0]>=-2&&e[0]<=26).map(e=>e[1]),-1):-2,hi=tm?Math.max(...tm.ext.filter(e=>e[0]>=-2&&e[0]<=26).map(e=>e[1]),6):7;
  const yb=Math.floor(lo/2)*2,yt=Math.ceil(hi/2)*2;
  let y0=24,y1=172;const Yt=f=>y1-(y1-y0)*(f-yb)/(yt-yb);
  const ticks=[];for(let v=yb;v<=yt;v+=2)ticks.push(v);grid(ticks,v=>v+' ft',Yt);
  let cm=null;
  if(tm){cm=currentModel(tm.ext,d.cur,dayStr);
    tiered(tm.tide,Yt,x=>Math.abs(cm.cur(x))<S.curMax?0:-1,3);
    for(const sk of cm.slacks){if(sk.turn==null||sk.turn<0||sk.turn>24)continue;const cx=X(sk.turn),cy=Yt(sk.h);const up=sk.ty==='H';
      s+=`<circle cx="${cx}" cy="${cy}" r="3.5" fill="#1a2847" stroke="#ffffff" stroke-width="1.5"/>`;
      s+=`<text x="${cx}" y="${cy+(up?-20:17)}" text-anchor="middle" font-size="10" fill="#ffffff">${up?'High':'Low'} ${fmt(sk.turn)}</text>`;
      s+=`<text x="${cx}" y="${cy+(up?-8:29)}" text-anchor="middle" font-size="10" fill="#5ad38a">slack ${fmt(sk.t)}</text>`;
      if(sk.t>=0&&sk.t<=24){s+=`<circle cx="${X(sk.t)}" cy="${Yt(tm.tide(sk.t))}" r="4.5" fill="#1a2847" stroke="#5ad38a" stroke-width="2.2"/>`;}}
    s+=`<text x="${XE}" y="${y0-8}" text-anchor="end" font-size="10" fill="#8e9bb8">current: ${cm.src}</text>`;
  }else{s+=`<text x="${(x0+XE)/2}" y="${(y0+y1)/2}" text-anchor="middle" font-size="12" fill="#8e9bb8">Tide data not loaded</text>`;}
  axisX(y1+13);

  const om=omSeries(d.om,dayStr);
  const wl=x=>om?windLvl(om.wind(x)):null, sl=x=>om?swellLvl(om.sw(x),om.per(x),om.dir(x),spot):null;
  // optimal strip
  const sy=226;title(sy-14,'Optimal conditions');
  s+=`<rect x="${x0}" y="${sy-7}" width="${XE-x0}" height="14" rx="3" fill="#2a3a5c"/>`;
  if(cm&&om){let wins=[],prev=null,a=0;
    for(let x=0;x<=24.0001;x+=0.1){const g=Math.abs(cm.cur(x))<S.curMax&&wl(x)===0&&sl(x)===0;if(prev!==null&&g!==prev){if(prev)wins.push([a,x]);a=x;}prev=g;}
    if(prev)wins.push([a,24]);wins=wins.map(w=>[Math.max(w[0],S.dayStart),Math.min(w[1],S.dayEnd)]).filter(w=>w[1]-w[0]>0.4);
    s+=`<rect x="${X(S.dayStart)}" y="${sy-9}" width="${X(S.dayEnd)-X(S.dayStart)}" height="18" rx="4" fill="none" stroke="#55627f" stroke-width="0.6"/>`;
    wins.forEach((w,i)=>{s+=`<rect x="${X(w[0])}" y="${sy-7}" width="${X(w[1])-X(w[0])}" height="14" rx="3" fill="#5ad38a"/>`;const cx=(X(w[0])+X(w[1]))/2;const tight=i>0&&cx-(X(wins[i-1][0])+X(wins[i-1][1]))/2<78;s+=`<text x="${cx}" y="${sy+(tight?34:22)}" text-anchor="middle" font-size="10" fill="#5ad38a">${fmt(w[0])}–${fmt(w[1])}</text>`;});
    if(!wins.length)s+=`<text x="${(x0+XE)/2}" y="${sy+22}" text-anchor="middle" font-size="10" fill="#8e9bb8">No window today</text>`;
  }else{s+=`<text x="${(x0+XE)/2}" y="${sy+22}" text-anchor="middle" font-size="10" fill="#8e9bb8">${om?'Needs tide data':'Needs wind and swell forecast'}</text>`;}

  // wind
  y0=286;y1=376;const wmax=om?Math.max(20,Math.ceil((Math.max(...[3,9,15,21].map(h=>om.wind(h)||0))+2)/10)*10):20;const Yw=v=>y1-(y1-y0)*v/wmax;
  title(y0-6,'Wind (mph)');bands(Yw,[0,S.windGood,S.windMarg,wmax]);
  const wt=[];for(let v=0;v<=wmax;v+=10)wt.push(v);grid(wt,v=>v+' mph',Yw);
  if(om){tiered(om.wind,Yw,wl,3);[3,12,21].forEach(h=>{const w=om.wind(h);if(w==null)return;s+=`<text x="${X(h)}" y="${Yw(w)-8}" text-anchor="middle" font-size="10" fill="#c9d2e3">${compass(om.wdir(h))} ${Math.round(w)} mph</text>`;});}
  else s+=`<text x="${(x0+XE)/2}" y="${(y0+y1)/2}" text-anchor="middle" font-size="12" fill="#8e9bb8">Forecast not available for this day</text>`;
  axisX(y1+13);
  // swell
  y0=422;y1=527;const hmax=om?Math.max(8,Math.ceil((Math.max(...[3,12,21].map(h=>om.sw(h)||0))+1)/2)*2):8;const Yh=v=>y1-(y1-y0)*v/hmax,Yp=v=>y1-(y1-y0)*v/20;
  title(y0-6,'Swell height (ft) and period (s)');bands(Yh,[0,Math.min(S.swellMax*0.67,hmax),Math.min(S.swellMax,hmax),hmax]);
  const ht=[];for(let v=0;v<=hmax;v+=hmax>8?4:2)ht.push(v);grid(ht,v=>v+' ft',Yh);
  for(const v of [0,10,20])s+=`<text x="${XE-3}" y="${Yp(v)-3}" text-anchor="end" font-size="10" fill="#8e9bb8">${v} s</text>`;
  if(om){tiered(om.per,Yp,()=>-2,2,true);tiered(om.sw,Yh,sl,3);
    [3,12,21].forEach(h=>{const v=om.sw(h),p=om.per(h);if(v==null)return;s+=`<text x="${X(h)}" y="${Yh(v)+16}" text-anchor="middle" font-size="10" fill="#c9d2e3">${compass(om.dir(h))} ${v.toFixed(1)} ft</text><text x="${X(h)}" y="${Yp(p)-7}" text-anchor="middle" font-size="10" fill="#8e9bb8">${Math.round(p)} s</text>`;});}
  axisX(y1+13);
  svg.innerHTML=s;
  st.innerHTML=(d.errors||[]).map(e=>`<span class="err">${e}</span>`).join('')+(d.fetched?`<span>Updated ${new Date(d.fetched).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span>`:'');
}

function moonPhase(ds){const [y,m,dd]=ds.split('-').map(Number);const t=Date.UTC(y,m-1,dd,20)/864e5-10962.76;const ph=((t/29.530588853)%1+1)%1;return {ill:(1-Math.cos(2*Math.PI*ph))/2,wax:ph<0.5};}
function moonSVG(f,wax){const r=7,rx=r*Math.abs(1-2*f),big=f>0.5?1:0;const lit=`M0,${-r} A${r},${r} 0 0 1 0,${r} A${rx},${r} 0 0 ${big} 0,${-r} Z`;return `<svg class="moon" width="16" height="16" viewBox="-8 -8 16 16"><circle r="${r}" fill="#2e3d5e" stroke="#8a97b3" stroke-width="0.6"/><g transform="scale(${wax?1:-1},1)"><path d="${lit}" fill="#e8edf7"/></g></svg>`;}
function drawCal(spot,d){
  const rows=document.getElementById('calRows');const st=document.getElementById('statusCal');const today=todayStr();
  let h='';const days=[];for(let i=-2;i<=27;i++)days.push(addDays(today,i));
  for(const ds of days){
    let lo=null,hi=null;if(d.tides){const vs=d.tides.filter(p=>p.t.slice(0,10)===ds).map(p=>p.v);if(vs.length){lo=Math.min(...vs);hi=Math.max(...vs);}}
    const om=omSeries(d.om,ds);let wmax=null,swv=null,swp=null,swd=null;
    let wlv=null,slv=null;
    if(om&&om.has(S.fishStart)&&om.has(S.fishEnd)){const hrs=[];for(let x=S.fishStart;x<=S.fishEnd;x+=1){const w=om.wind(x),v=om.sw(x);if(w==null||v==null)continue;hrs.push({w,v,p:om.per(x),d:om.dir(x)});}
      if(hrs.length){const bw=hrs.slice().sort((a,b)=>a.w-b.w),bs=hrs.slice().sort((a,b)=>a.v-b.v);const mw=bw[Math.floor(bw.length/2)],ms=bs[Math.floor(bs.length/2)];
        wmax=mw.w;swv=ms.v;swp=ms.p;swd=ms.d;wlv=windLvl(wmax);slv=swellLvl(swv,swp,swd,spot);
        if(hrs.some(r=>windLvl(r.w)===2))wlv=2;if(hrs.some(r=>swellLvl(r.v,r.p,r.d,spot)===2))slv=2;}}
    const go=wlv===0&&slv===0;
    const mp=moonPhase(ds);const range=(hi!=null&&lo!=null)?hi-lo:0;const pct=Math.round(clamp(range/8,0.3,1)*100);
    const wd=dow(ds),we=wd==='Sat'||wd==='Sun';const [,mm,dd]=ds.split('-');const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mm-1];
    const pill=(txt,lvl,w)=>lvl==null?`<span class="pill n" style="width:${w}px">—</span>`:`<span class="pill ${'gyr'[lvl]}" style="width:${w}px">${txt}</span>`;
    h+=`<button class="row" data-day="${ds}">
      <span class="mid"><span class="lo">${lo==null?'':lo.toFixed(1)+' ft'}</span><span class="bw">
      <span class="bar${ds===today?' today':''}${go?' go':''}" style="width:${pct}%">${moonSVG(mp.ill,mp.wax)}<span class="wd${we?' we':''}">${wd}</span>${mon} ${+dd}</span></span>
      <span class="hi">${hi==null?'':hi.toFixed(1)+' ft'}</span></span>
      <span class="pc" style="width:64px">${pill(swv==null?'':swv.toFixed(1)+' · '+Math.round(swp)+'s',slv,58)}</span>
      <span class="pc" style="width:44px">${pill(wmax==null?'':Math.round(wmax),wlv,36)}</span></button>`;
  }
  rows.innerHTML=h;document.getElementById('calHint').textContent=`Pills: ${fmt(S.fishStart)}–${fmt(S.fishEnd)}`;
  st.innerHTML=(d.errors||[]).map(e=>`<span class="err">${e}</span>`).join('');
}


function drawSpots(){
  const el=document.getElementById('strips');const st=document.getElementById('statusSpots');const today=todayStr();
  const CW=42,DW=CW*5,LW=52,ND=7;const slots=[6,9,12,15,18];const W=LW+ND*DW;
  const X=h=>{const d=Math.floor(h/24),hh=h-d*24;return LW+d*DW+clamp((hh-S.dayStart)/(S.dayEnd-S.dayStart),0,1)*DW;};
  const inDay=h=>{const hh=h-Math.floor(h/24)*24;return hh>=S.dayStart&&hh<=S.dayEnd;};
  const arrow=(deg,c)=>deg==null?'':`<span class="arrow" style="transform:rotate(${deg+180}deg);color:${c}">↑</span>`;
  const col=['#5ad38a','#e9b949','#e36a6a'],txt=['#0f2b1c','#3d2e00','#3a0c0c'];
  let out=`<div style="display:inline-block;min-width:100%;">`;
  out+=`<div style="display:flex;"><div style="width:${LW}px;flex:none;"></div>`;
  for(let d=0;d<ND;d++){const ds=addDays(today,d);const [,mm,dd]=ds.split('-');out+=`<div style="width:${DW}px;flex:none;border-left:0.5px solid #55627f;padding:0 0 2px 6px;color:#fff;font-size:12px;font-weight:600;">${dow(ds)} <span style="color:#8e9bb8;font-weight:400">${+dd}</span></div>`;}
  out+=`</div><div style="display:flex;"><div style="width:${LW}px;flex:none;"></div>`;
  for(let d=0;d<ND;d++)slots.forEach((s,i)=>{out+=`<div style="width:${CW}px;flex:none;text-align:center;font-size:9px;color:#8e9bb8;${i===0?'border-left:0.5px solid #55627f;':''}">${s===12?'12p':s<12?s+'a':(s-12)+'p'}</div>`;});
  out+=`</div>`;
  let errs=[];
  for(const key of Object.keys(SPOTS)){
    const sp=SPOTS[key];const d=data[key]||store.get('sf.data.'+key);
    out+=`<div style="margin-top:10px;border-top:0.5px solid #55627f;"><div style="display:flex;"><span class="spotname">${sp.name}</span></div>`;
    if(!d||(!d.om&&!d.tides)){out+=`<div style="padding:4px 8px 8px;font-size:11px;color:#8e9bb8;">Loading…</div></div>`;continue;}
    if(d.errors&&d.errors.length)errs.push(sp.short+': '+d.errors.join('; '));
    const om=omSeries(d.om,today);
    const cells=[];for(let dd=0;dd<ND;dd++)for(const s of slots){const x=dd*24+s;cells.push(om&&om.has(x)?{w:om.wind(x),wd:om.wdir(x),sw:om.sw(x),sd:om.dir(x),p:om.per(x),x}:{x});}
    const row=(label,hgt,fn)=>{out+=`<div style="display:flex;align-items:stretch;height:${hgt}px;"><div class="lab" style="width:${LW}px;">${label}</div>`;cells.forEach((c,i)=>{out+=fn(c,i);});out+=`</div>`;};
    row('wind',24,(c,i)=>{const l=windLvl(c.w);const bg=l==null?'#2a3a5c':col[l],fg=l==null?'#8e9bb8':txt[l];return `<div class="cell" data-spot="${key}" data-day="${addDays(today,Math.floor(c.x/24))}" style="width:${CW}px;background:${bg};color:${fg};${i%5===0?'border-left:1px solid #152038;':''}">${l==null?'—':arrow(c.wd,fg)+Math.round(c.w)}</div>`;});
    row('swell',30,(c,i)=>{const l=swellLvl(c.sw,c.p,c.sd,key);const bg=l==null?'#2a3a5c':col[l],fg=l==null?'#8e9bb8':txt[l];return `<div class="cell" data-spot="${key}" data-day="${addDays(today,Math.floor(c.x/24))}" style="width:${CW}px;flex-direction:column;gap:0;line-height:1.05;background:${bg};color:${fg};${i%5===0?'border-left:1px solid #152038;':''}">${l==null?'—':`<span>${arrow(c.sd,fg)}${c.sw.toFixed(0)}</span><span style="font-size:8px;font-weight:400;opacity:.8">${Math.round(c.p)}s</span>`}</div>`;});
    // tide line + go bar
    let tm=null,cm=null;if(d.tides){tm=tideModel(d.tides,today);cm=currentModel(tm.ext,d.cur,today);}
    const TH=30;let svg=`<svg width="${W}" height="${TH}" viewBox="0 0 ${W} ${TH}" style="display:block"><line x1="${LW}" y1="12" x2="${W}" y2="12" stroke="#55627f" stroke-width="1"/>`;
    for(let dd=0;dd<ND;dd++)svg+=`<line x1="${LW+dd*DW}" y1="0" x2="${LW+dd*DW}" y2="${TH}" stroke="#55627f" stroke-width="0.5"/>`;
    if(tm){for(const e of tm.ext){if(e[0]<0||e[0]>ND*24||!inDay(e[0]))continue;svg+=`<circle cx="${X(e[0])}" cy="12" r="3" fill="#ffffff"/><text x="${X(e[0])}" y="27" text-anchor="middle" font-size="8" fill="#c9d2e3">${e[2]} ${e[1].toFixed(1)}</text>`;}
      let lastX=-99;for(const s of cm.slacks){if(s.t<0||s.t>ND*24||!inDay(s.t))continue;const x=X(s.t);svg+=`<circle cx="${x}" cy="12" r="3.5" fill="#152038" stroke="#5ad38a" stroke-width="1.8"/>`;if(x-lastX>30)svg+=`<text x="${x}" y="7" text-anchor="middle" font-size="8" fill="#5ad38a">${fmt(s.t).replace(/[ap]m$/,'')}</text>`;lastX=x;}}
    svg+=`</svg>`;
    out+=`<div style="position:relative;height:${TH}px;"><div class="lab" style="position:sticky;left:0;width:${LW}px;height:${TH}px;">tide</div><div style="position:absolute;left:0;top:0;">${svg}</div></div>`;
    let bar=`<svg width="${W}" height="12" viewBox="0 0 ${W} 12" style="display:block">`;
    for(let dd=0;dd<ND;dd++){bar+=`<rect x="${LW+dd*DW}" y="2" width="${DW}" height="8" rx="2" fill="#2a3a5c"/>`;
      if(cm&&om){let a=null;for(let h=dd*24+S.dayStart;h<=dd*24+S.dayEnd+0.001;h+=0.1){const g=om.has(h)&&Math.abs(cm.cur(h))<S.curMax&&windLvl(om.wind(h))===0&&swellLvl(om.sw(h),om.per(h),om.dir(h),key)===0;if(g&&a===null)a=h;if((!g||h>=dd*24+S.dayEnd)&&a!==null){const b=g?h:h-0.1;if(b-a>0.4)bar+=`<rect x="${X(a)}" y="2" width="${X(b)-X(a)}" height="8" rx="2" fill="#5ad38a"/>`;a=null;}}}}
    bar+=`</svg>`;
    out+=`<div style="position:relative;height:12px;margin:1px 0 2px;"><div class="lab" style="position:sticky;left:0;width:${LW}px;height:12px;line-height:1;">go</div><div style="position:absolute;left:0;top:0;">${bar}</div></div></div>`;
  }
  out+=`</div>`;el.innerHTML=out;
  st.innerHTML=errs.map(e=>`<span class="err">${e}</span>`).join('');
}

// ---------- app state / routing ----------
let view='day',day=todayStr();
function parseHash(){const hs=location.hash.slice(1);if(hs==='cal'){view='cal';}else if(hs==='spots'){view='spots';}else if(/^day-\d{4}-\d{2}-\d{2}$/.test(hs)){view='day';day=hs.slice(4);}else view='day';}
function setHash(){const want=view==='cal'?'cal':view==='spots'?'spots':'day-'+day;if(location.hash.slice(1)!==want)history.replaceState(null,'','#'+want);}
async function render(force){
  parseHash();
  document.getElementById('spotName').textContent=view==='spots'?'All spots':SPOTS[spotKey].name;
  for(const b of document.querySelectorAll('.bnav button'))b.setAttribute('aria-selected',b.dataset.v===view);
  document.getElementById('viewDay').hidden=view!=='day';document.getElementById('viewCal').hidden=view!=='cal';document.getElementById('viewSpots').hidden=view!=='spots';
  if(view==='spots'){drawSpots();const keys=Object.keys(SPOTS);await Promise.all(keys.map(k=>load(k,force).then(()=>{if(view==='spots')drawSpots();})));return;}
  document.getElementById('dayTitle').innerHTML=`${longDate(day).replace(/^(\w+), /,'')}<small>${dow(day)==='Sat'||dow(day)==='Sun'?'weekend':dow(day)}${day===todayStr()?' · today':''}</small>`;
  const cached=data[spotKey]||store.get('sf.data.'+spotKey);
  if(cached){if(view==='day')drawDay(spotKey,day,cached);else drawCal(spotKey,cached);}
  else{document.getElementById(view==='day'?'statusDay':'statusCal').textContent='Loading tides, currents and forecast…';}
  const d=await load(spotKey,force);
  if(view==='day')drawDay(spotKey,day,d);else if(view==='cal')drawCal(spotKey,d);
}
document.getElementById('tabDay').onclick=()=>{view='day';setHash();render();};
document.getElementById('tabCal').onclick=()=>{view='cal';setHash();render();};
document.getElementById('tabSpots').onclick=()=>{view='spots';setHash();render();};
document.getElementById('strips').addEventListener('click',e=>{const c=e.target.closest('.cell');if(!c)return;spotKey=c.dataset.spot;store.set('sf.spot',spotKey);day=c.dataset.day;view='day';setHash();render();window.scrollTo({top:0});});
document.getElementById('prevDay').onclick=()=>{day=addDays(day,-1);setHash();render();};
document.getElementById('nextDay').onclick=()=>{day=addDays(day,1);setHash();render();};
document.getElementById('calRows').addEventListener('click',e=>{const b=e.target.closest('.row');if(!b)return;day=b.dataset.day;view='day';setHash();render();window.scrollTo({top:0});});
window.addEventListener('hashchange',()=>render());

// ---------- sheets ----------
const sheet=document.getElementById('sheet'),box=document.getElementById('sheetBox');
function openSheet(html){box.innerHTML=html;sheet.hidden=false;}
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.hidden=true;});
document.getElementById('btnSpot').onclick=()=>{
  openSheet('<h2>Spot</h2>'+Object.entries(SPOTS).map(([k,v])=>`<button class="spot${k===spotKey?' on':''}" data-k="${k}">${v.name}<small>Tides ${v.tide}${v.cur?' · currents '+v.cur+' (NOAA)':' · currents modeled'}</small></button>`).join(''));
  box.querySelectorAll('.spot').forEach(b=>b.onclick=()=>{spotKey=b.dataset.k;store.set('sf.spot',spotKey);sheet.hidden=true;render();});
};
document.getElementById('btnSettings').onclick=()=>{
  const f=(k,l,step)=>`<label for="s_${k}">${l}</label><input id="s_${k}" type="number" step="${step||0.1}" value="${S[k]}">`;
  openSheet('<h2>Settings</h2><div class="set">'+
   '<h3>Fishing hours</h3>'+f('fishStart','Calendar pills judge from (hour, 0–23)',1)+f('fishEnd','…to (hour)',1)+f('dayStart','Day view windows from (hour)',1)+f('dayEnd','…to (hour)',1)+
   '<h3>Thresholds</h3>'+f('curMax','Slow water: current under (kt)')+f('windGood','Good wind: up to (mph)',1)+f('windMarg','Marginal wind: up to (mph)',1)+f('swellMax','Fishable swell: height up to (ft)',0.5)+f('periodRatio','…and period at least × height',0.1)+f('openPenalty','Penalize swell from exposed directions (1 on, 0 off)',1)+
   '<h3>Current model (Point Lobos fit)</h3>'+f('lagH0','Lag after high: base (min)',1)+f('lagH1','Lag after high: + per ft of swing',0.5)+f('lagL0','Lag after low: base (min)',1)+f('lagL1','Lag after low: + per ft of swing in',0.5)+f('lagL2','Lag after low: − per ft of swing out',0.5)+f('ktPerFt','Peak current per ft of swing (kt)',0.01)+
   '</div><div class="btnrow"><button id="sReset">Reset defaults</button><button id="sRefresh">Refresh data</button><button id="sSave" class="pri">Save</button></div><div class="btnrow"><button id="sReload">Reload app (build '+BUILD+')</button></div>'+
   '<p class="note">Slack lags and peak speeds for every spot except the Golden Gate are estimated from the tide curve using coefficients fitted to NOAA\'s Point Lobos station. They are a starting point; tune them against your own drift readings.</p>');
  box.querySelector('#sSave').onclick=()=>{for(const k of Object.keys(DEFAULTS)){const el=box.querySelector('#s_'+k);if(el&&el.value!=='')S[k]=+el.value;}store.set('sf.settings',S);sheet.hidden=true;render();};
  box.querySelector('#sReset').onclick=()=>{S={...DEFAULTS};store.set('sf.settings',S);sheet.hidden=true;render();};
  box.querySelector('#sRefresh').onclick=()=>{sheet.hidden=true;render(true);};
  box.querySelector('#sReload').onclick=()=>{location.href=location.pathname+'?v='+Date.now()+location.hash;};
};
render();
})();
</script>

</body>
</html>
